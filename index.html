<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mind Mate – Guiding Minds. Growing Together.</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--p:#5b1050;--g:#f6b45d;--bg:#faf5ee;--c:#fff;--t:#2b1f2a;--m:#6f5f6d;--ln:#eadfe8;--soft:#f4ebf3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--p:#e2b8ee;--bg:#1c1220;--c:#2a1c2e;--t:#f3e9f1;--m:#b9a7b6;--ln:#43304a;--soft:#33223a}}
:root[data-theme=dark]{--p:#e2b8ee;--bg:#1c1220;--c:#2a1c2e;--t:#f3e9f1;--m:#b9a7b6;--ln:#43304a;--soft:#33223a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--t);line-height:1.5}
h1,h2,h3{color:var(--p);margin:0 0 6px}p{margin:6px 0;color:var(--m)}small{color:var(--m)}
button{font:inherit;cursor:pointer;border:0;border-radius:24px;padding:10px 20px;background:#5b1050;color:#fff;font-weight:600}
button.g{background:var(--g);color:#5b1050}button.o{background:transparent;color:var(--p);border:1.5px solid var(--p)}button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;margin:4px 0 10px;border:1px solid var(--ln);border-radius:12px;background:var(--c);color:var(--t)}
label{font-weight:600;font-size:14px;color:var(--p)}
.lk{color:var(--p);cursor:pointer;font-size:14px;text-decoration:underline;display:inline-block;margin-top:10px}
.card{background:var(--c);border:1px solid var(--ln);border-radius:18px;padding:20px;margin-bottom:16px}
.tile{cursor:pointer}.tile:hover{border-color:var(--g)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.pub{max-width:820px;margin:0 auto;padding:28px 16px;text-align:center}.pub .card{text-align:center}
.logo img{width:min(300px,80%);height:auto}@media(prefers-color-scheme:dark){.logo img{background:#faf5ee;border-radius:18px;padding:8px}}.form{max-width:440px;margin:14px auto;text-align:left}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--c);border-right:1px solid var(--ln);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.lg{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--p);font-size:18px;padding:0 8px 12px}.lg img{height:38px;width:auto}
nav .n{display:block;padding:10px 14px;border-radius:14px;color:var(--t);cursor:pointer;font-weight:600}
nav .n.on{background:#5b1050;color:#fff}.nb{background:var(--g);color:#5b1050;border-radius:10px;padding:0 7px;font-size:12px;margin-left:6px}
.main{padding:24px;max-width:900px;width:100%}
.help{margin-top:auto;font-size:13px;background:var(--soft);border-radius:14px;padding:12px;color:var(--m)}
.moods{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:10px}.moods button{padding:14px 6px;border-radius:16px;color:#2b1f2a;font-size:15px}
#orb{width:120px;height:120px;border-radius:50%;background:var(--g);color:#5b1050;font-weight:800;display:flex;align-items:center;justify-content:center;margin:18px auto;transition:transform 4s ease-in-out}#orb.in{transform:scale(1.4)}
@media(prefers-reduced-motion:reduce){#orb{transition:none}}
.msgs{height:48vh;overflow:auto;background:var(--soft);border-radius:14px;padding:12px;margin:10px 0}
.bb{max-width:75%;padding:8px 12px;border-radius:14px;margin:6px 0;white-space:pre-wrap;word-break:break-word}.bb small{display:block;opacity:.7;font-size:11px;color:inherit}
.me{background:#5b1050;color:#fff;margin-left:auto}.th{background:var(--c);border:1px solid var(--ln);color:var(--t)}
.row{display:flex;gap:8px}.row input{margin:0}
.mc{display:flex;gap:14px;position:relative;align-items:flex-start}.mc.pk{cursor:pointer}.mc.sel{outline:3px solid var(--p)}.mc.off{opacity:.5;cursor:default}
.av{width:52px;height:52px;border-radius:50%;background:#5b1050;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.tg{display:inline-block;background:var(--soft);color:var(--p);border-radius:12px;padding:2px 10px;font-size:12px;margin:2px 4px 0 0}
.bd{font-size:11px;background:#e7f6ea;color:#1b7a36;padding:2px 8px;border-radius:10px}.un{position:absolute;right:16px;top:14px}
.bar{position:sticky;bottom:12px;background:#5b1050;color:#fff;border-radius:18px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.bar p{color:#fff;margin:0}.bar button{background:#fff;color:#5b1050}
.warn{background:#fff3e0;color:#5b3a00;border-radius:12px;padding:10px 14px;margin:8px 0}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px}.bars i{flex:1;border-radius:6px 6px 0 0;min-width:10px}
.q{font-style:italic}.grow{flex:1}.sp{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#t{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b1f2a;color:#fff;padding:10px 18px;border-radius:20px;display:none;z-index:9}
@media(max-width:760px){.shell{display:block}nav{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--ln)}.lg,.help{display:none}nav .n{white-space:nowrap}.main{padding:16px}}

<p style="background:var(--soft);border-radius:24px;padding:16px"><b>100% Safe &amp; Anonymous</b> | Your privacy is protected | Connect with verified mentors</p>${SB?'':'<small>Demo mode: chats work only between tabs of this browser until Supabase keys are added.</small>'}</div>`;

:`<div class="pub"><div class="logo">${LOGO}</div><h2>Student sign up</h2><p>Tell us a bit about yourself. Stay anonymous.</p><div class="card form">${fld('ag','Age (18 or above)','Enter your age','number')}${gen}${fld('co','Course / field of study','e.g. Computer Science')}${fld('hb','Hobbies &amp; interests','Reading, Sports, Music (comma separated)')}<button class="g" data-a="ss" style="width:100%">Continue to select mentor</button></div><span class="lk" data-a="go" data-v="#/" tabindex="0">Back</span></div>`;

const V={
home(u){if(u.role=='elder'){const on=u.on!==false;return`<div class="card"><div class="sp"><div><h1>Welcome, ${E(u.alias||'Mentor')}</h1><span class="bd">✔ Verified mentor</span><p>You are <b>${on?'ONLINE':'OFFLINE'}</b>. Students can send requests only while you are online.</p></div><button class="${on?'o':'g'}" data-a="tgl">${on?'Go offline':'Go online'}</button></div></div><div class="two"><div class="card tile" data-a="go" data-v="#/requests" tabindex="0"><h3>Requests</h3><p>${S.r.filter(r=>r.m==u.id&&r.st=='p').length} waiting for you</p></div><div class="card tile" data-a="go" data-v="#/chats" tabindex="0"><h3>Active chats</h3><p>${S.r.filter(r=>r.m==u.id&&r.st=='a').length} students connected</p></div></div><div class="card"><h3>Listening guide</h3><p>Listen first, advise second. You are a mentor, not a therapist. If a student mentions self-harm, share Tele-MANAS 14416 and encourage them to reach a trusted person.</p></div>`}

return`<div class="card" style="text-align:center"><div class="logo">${LOGO}</div><h1>Hi ${E(u.alias)}</h1><p class="q">"${QUOTES[new Date().getDate()%QUOTES.length]}"</p></div>
<div class="card"><h3>How are you feeling today?</h3><div class="moods">${MOODS.map((m,i)=>`<button data-a="mood" data-v="${i}" style="background:${m[3]}">${m[1]}<br>${m[0]}</button>`).join('')}</div>${last?`<p>${TIPS[MOODS[last.i][0]]}</p>`:''}</div>
<div class="two">${[['Connect with a mentor','Send a request to a verified mentor','#/select-mentor'],['Breathing exercise','Calm your mind in 2 minutes','#/wellness'],['Private diary','Write what you feel','#/diary'],['Community support','Read encouraging stories','#/community']].map(c=>`<div class="card tile" data-a="go" data-v="${c[2]}" tabindex="0"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join('')}</div>`},
'select-mentor'(u){const L=MS();return`<h2>Select your mentor</h2><p>Choose a mentor who matches your interests and goals, then send a connection request.</p>${L.map(m=>mc(m,'',m.on?`data-a="pick" data-v="${m.id}" tabindex="0"`:'',m.on?'pk'+(sel==m.id?' sel':''):'off')).join('')}<div class="bar"><div><b>Ready to connect?</b><p>${sel?'Send a request to the selected mentor':'Choose an available mentor first'}</p></div><button data-a="req" ${sel?'':'disabled'}>Send request</button></div>`},

mood(u){const x=S.md.filter(m=>m.u==u.id),l=x.slice(-14),c={};x.forEach(m=>c[MOODS[m.i][0]]=(c[MOODS[m.i][0]]||0)+1);return`<h2>Mood</h2><div class="card">${l.length?`<div class="bars" role="img" aria-label="Mood over time">${l.map(m=>`<i style="height:${MOODS[m.i][2]*24}px;background:${MOODS[m.i][3]}" title="${MOODS[m.i][0]}, ${new Date(m.t).toLocaleDateString()}"></i>`).join('')}</div><p>${Object.entries(c).map(e=>e[0]+' ×'+e[1]).join(' · ')}</p>`:'<p>No moods logged yet. Pick one on Home.</p>'}</div>`},
community(){return`<h2>Community</h2><p>Encouraging stories from students and mentors.</p>${STORIES.map(s=>`<div class="card"><h3>${s[0]}</h3><p style="color:var(--t)">${s[1]}</p><small>${s[2]}</small></div>`).join('')}`},
safety(){return`<h2>Safety</h2><div class="card"><h3>In crisis? Reach out now</h3><p style="color:var(--t)"><b>Tele-MANAS: 14416</b> (free, 24x7)<br><b>iCall: 9152987821</b><br><b>Emergency: 112</b></p></div><div class="card"><h3>How Mind Mate keeps you safe</h3><p>You are anonymous. Mentors see only your alias. Mentors are peers with life experience, not therapists. Never share your real name, phone number or address in chat.</p></div>`},
profile(u){return`<h2>Profile</h2><div class="card"><p style="color:var(--t)"><b>${u.role=='student'?'Anonymous name':'Mentor'}:</b> ${E(u.alias||'Anonymous Mentor')}<br><b>Age:</b> ${u.age}<br><b>Gender:</b> ${E(u.g)}<br>${u.role=='student'?`<b>Course:</b> ${E(u.co)}`:`<b>Passion:</b> ${E(u.p)}<br><b>Experience:</b> ${E(u.y||'')}`}<br><b>Hobbies:</b> ${u.h.map(E).join(', ')||'–'}</p></div>`},
requests(u){const rs=S.r.filter(r=>r.m==u.id&&r.st=='p');return`<h2>Requests</h2>${rs.length?rs.map(r=>{const s=S.u.find(x=>x.id==r.s);return s?`<div class="card"><div class="sp"><div><b>${E(s.alias)}</b> wants to talk<p>${s.age} yrs · ${E(s.co)}</p>${s.h.map(h=>`<span class="tg">${E(h)}</span>`).join('')}</div><span><button data-a="acc" data-v="${r.id}">Accept</button> <button class="o" data-a="dec" data-v="${r.id}">Decline</button></span></div></div>`:''}).join(''):'<div class="card"><p>No requests yet. Stay online and students will find you.</p></div>'}`},
chats(u){const rs=S.r.filter(r=>r.m==u.id&&r.st=='a');return`<h2>Chat</h2>${rs.length?rs.map(r=>{const s=S.u.find(x=>x.id==r.s);return s?`<div class="card tile sp" data-a="go" data-v="#/chat/${s.id}" tabindex="0"><b>${E(s.alias)}</b><button>Open chat</button></div>`:''}).join(''):'<div class="card"><p>No active chats. Accept a request to begin.</p></div>'}`},
chat(u,id){const st=u.role=='student',s=st?u.id:id,m=st?id:u.id;
if(!S.r.some(r=>r.st=='a'&&r.s==s&&r.m==m))return`<div class="card"><p>You are not connected yet.</p><button data-a="go" data-v="#/${st?'connect':'chats'}">Back</button></div>`;
const c=s+'|'+m,peer=st?MS().find(x=>x.id==m):S.u.find(x=>x.id==s);cc={c,demo:st&&m[0]=='d'};
const L=S.m.filter(x=>x.c==c).sort((a,b)=>a.t-b.t),cr=L.some(x=>x.f=='student'&&CR.test(x.x));
return`<div class="card"><div class="sp"><div><h3>${st?'Anonymous Mentor':E(peer?.alias)}</h3><small>${st?E(peer?.p||''):'Student'} · Anonymous chat</small></div><button class="o" data-a="go" data-v="#/${st?'connect':'chats'}">Back</button></div>${cr?'<div class="warn"><b>If you or someone is in danger:</b> call Tele-MANAS 14416 (free, 24x7) or 112 right now.</div>':''}<div class="msgs" id="msgs">${L.length?L.map(x=>`<div class="bb ${x.f==u.role?'me':'th'}">${E(x.x)}<small>${new Date(x.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</small></div>`).join(''):`<p>${st?'Say hello. Your identity stays anonymous.':'Say hello to start the conversation.'}</p>`}</div><div class="row"><input id="ci" placeholder="Type your message…" autocomplete="off" aria-label="Message"><button data-a="send">Send</button></div></div>`}
};

function render(sy){const v0=$('#ci')?.value,d0=$('#dt')?.value,[p,id]=location.hash.slice(2).split('/'),u=me();
if(bt&&p!='wellness'){clearInterval(bt);bt=0}
S.r.forEach(r=>{if(u&&r.s==u.id&&r.m[0]=='d'&&r.st=='p'&&Date.now()-r.t>1000){r.st='a';put('r',r,1)}});
if(!u){if(sy)return;A.innerHTML=({signup,signin}[p]||landing)(id);return}
if(!V[p]||!(NAV[u.role].some(n=>n[0]==p)||p=='chat'||(p=='select-mentor'&&u.role=='student')))return go('#/home');
A.innerHTML=shell(u,p,V[p](u,id));
if(v0){const i=$('#ci');if(i){i.value=v0;i.focus()}}
if(d0){const i=$('#dt');if(i)i.value=d0}
const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight}

function breathe(){const o=$('#orb'),b=$('#br');if(bt){clearInterval(bt);bt=0;o.className='';o.textContent='Ready';b.textContent='Start 4-4-6';return}
b.textContent='Stop';const P=[['Inhale',4,'in'],['Hold',4,'in'],['Exhale',6,'']];let s=0,l=0;
bt=setInterval(()=>{const x=$('#orb');if(!x){clearInterval(bt);bt=0;return}if(l<=0){const q=P[s++%3];x.textContent=q[0];x.className=q[2];l=q[1]}l--},1000)}
const hobs=()=>v('hb').split(',').map(x=>x.trim()).filter(Boolean).slice(0,5);
const A1=['Calm','Brave','Gentle','Sunny','Quiet','Bright','Kind'],N1=['Panda','Otter','Sparrow','Lotus','Fox','Koala','Dove'];

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,x=t.dataset.v,u=me();
if(a=='go')go(x);
else if(a=='out'){setMe(null);go('#/')}
else if(a=='in'){setMe(x);go('#/home')}
else if(a=='ss'){const age=+v('ag');if(!(age>=18))return toast('Students must be 18 or above');if(!v('g')||!v('co'))return toast('Please fill gender and course');
 const n={id:rid(),role:'student',alias:A1[Math.random()*7|0]+N1[Math.random()*7|0]+(10+Math.random()*89|0),age,g:v('g'),co:v('co'),h:hobs()};
 setMe(n.id);addAcc(n.id);put('u',n);go('#/select-mentor')}
else if(a=='se'){const age=+v('ag');if(!(age>=60&&age<=75))return toast('Mentors must be between 60 and 75');if(!v('g')||!v('p'))return toast('Please fill gender and passion');
 const n={id:rid(),role:'elder',alias:'Mentor '+rid().slice(0,3).toUpperCase(),age,g:v('g'),p:v('p'),y:v('y'),h:hobs(),on:true};
 setMe(n.id);addAcc(n.id);put('u',n);go('#/home')}
else if(a=='pick'){sel=sel==x?null:x;render()}
else if(a=='req'){if(!sel)return;if(S.r.some(r=>r.s==u.id&&r.m==sel&&r.st!='x'))return toast('Already requested');
 put('r',{id:rid(),s:u.id,m:sel,st:'p',t:Date.now()});sel=null;go('#/connect');toast('Request sent');setTimeout(render,1300)}
else if(a=='acc'||a=='dec'){const r=S.r.find(r=>r.id==x);if(!r)return;r.st=a=='acc'?'a':'x';put('r',r);if(a=='acc')go('#/chat/'+r.s)}
else if(a=='tgl'){const m=S.u.find(z=>z.id==u.id);m.on=m.on===false;put('u',m)}
else if(a=='mood'){priv(()=>S.md.push({u:u.id,i:+x,t:Date.now()}));toast('Mood saved')}
else if(a=='diary'){const d=v('dt');if(!d)return;priv(()=>S.dy.push({u:u.id,x:d,t:Date.now()}));toast('Saved')}
else if(a=='br')breathe();
else if(a=='send'){const d=v('ci');if(!d||!cc)return;const c=cc.c,demo=cc.demo;$('#ci').value='';
 put('m',{id:rid(),c,f:u.role,x:d,t:Date.now()});
 if(demo)setTimeout(()=>{const n=S.m.filter(z=>z.c==c&&z.f=='student').length;put('m',{id:rid(),c,f:'elder',x:RP[(n-1)%RP.length],t:Date.now()})},1600)}});
document.addEventListener('keydown',e=>{if(e.key!='Enter')return;if(e.target.id=='ci'){$('[data-a=send]').click()}else if(e.target.dataset?.a&&e.target.tagName!='BUTTON')e.target.click()});
addEventListener('hashchange',()=>render());
addEventListener('storage',e=>{if(!SB&&e.key=='mm'){loadLocal();render(1)}});
render();
if(SB){pull();setInterval(pull,4000);SB.channel('mm').on('postgres_changes',{event:'*',schema:'public',table:'mm_rows'},p=>{const x=p.new;if(x&&x.kind&&S[x.kind]&&mrg(x.kind,x.data))render(1)}).subscribe()}
</script></body></html>
